// tf2cc movement. Sections are role keys or stock class names
// (scout sniper soldier demoman medic heavy pyro spy engineer).
//   autohop      1 = holding jump re-jumps on landing (OF of_bunnyhop -1 = Mercenary only)
//   jump_sounds  played on each successful ground jump (0.5 s gate, tf2cc_jump_sound_gate)
//   jump_volume  OF "Mercenary.Jumpsound": volume 0.6, 95 dB
// tf2cc_autohop_all 1 / tf2cc_autohop_stock_classes extend autohop to stock classes.
"tf2cc_movement"
{
	"mercenary"
	{
		"autohop"      "1"
		"jump_volume"  "0.6"
		"jump_sounds"
		{
			"1" "vo/custom/mercenary_jump01.wav"
			"2" "vo/custom/mercenary_jump02.wav"
			"3" "vo/custom/mercenary_jump03.wav"
		}
	}
	"civilian"
	{
		// TF2C Civilian cannot bunnyhop; the legacy classicmovement build let
		// every class-10 player hop. Set to 1 to restore that behaviour.
		"autohop"      "0"
	}
}
