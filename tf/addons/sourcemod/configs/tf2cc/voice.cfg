// tf2cc voice personas.
// Persona sections and their concept keys are carried over verbatim from the
// legacy MarxVee configs/customclasses/voicepacks/voicechanger.cfg (the curated
// line lists); concept keys are the old sound-substring keys.
// Concepts used by plugins: _painsharp _painsevere _paincrticialdeath (sic)
// _domination _revenge _autoonfire _autocappedcontrolpoint
// _autocappedintelligence _taunts _laughlong _cloakedspy0
// _cloakedspyidentify01..09 _umbrellaboost (falls back to _battlecry).
"tf2cc_voice"
{
	// voicemenu "<menu> <item>" -> concept (keys of the persona sections below).
	// "@spy" = Spy! callout keyed by the spotted spy's disguise class.
	// Stock classes speaking about role players - Open Fortress talker rules
	// (scout.txt:126/137/1014, soldier.txt:113, engineer.txt:115). OF-only files,
	// stored under vo/tf2cc/of/ so they never shadow stock paths (OF's
	// engineer_cloakedspyidentify10 differs from the stock file of that name).
	"targeted"
	{
		"scout"
		{
			"mercenary"
			{
				"cloakedspy"  { "1" "vo/tf2cc/of/scout_cloakedspyidentify10.mp3" }
				"domination"
				{
					"1" "vo/tf2cc/of/scout_dominationmerc01.mp3"
					"2" "vo/tf2cc/of/scout_dominationmerc02.mp3"
					"3" "vo/tf2cc/of/scout_dominationmerc03.mp3"
					"4" "vo/tf2cc/of/scout_dominationmerc04.mp3"
