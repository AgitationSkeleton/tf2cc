// tf2cc weapons.
//
// Every weapon is a real stock econ weapon (the "donor") chosen so that its
// engine slot, firing behaviour and first/third-person animation family match
// the original weapon. Attributes then tune it toward the reference stats.
// The plugin validates each donor against scripts/items/items_game.txt at
// startup (sm_tf2cc_weapons) and reports mismatches instead of guessing.
//
// Keys:
//   name, roles   menu/HUD name; comma list of role keys that may hold it
//   enabled       0 = not handed out anywhere (MarxVee-only items ship disabled)
//   slot          primary | secondary | melee | utility (must equal the donor's engine slot)
//   classname     donor entity class (already translated for the arms family)
//   itemdef       donor item definition index
//   arms_family   donor class whose arms/animations are used (scout..engineer)
//   worldmodel    third-person / dropped model (attached as a wearable; the donor is hidden)
//   viewmodel     the original OF/TF2C first-person model
//   viewmodel_generated   donor-retargeted copy of it (written by the build tools; preferred)
//   viewmodel_mode        per-weapon override of tf2cc_viewmodel_mode (auto | custom | family)
//   clip          clip override (-1 = donor + attributes)
//   reserve       max reserve ammo (-1 = donor class default)
//   attributes    { "attribute name" "value" } via TF2Attributes
//   sounds        { "1" { "find" "<stock sample>" "replace" "<custom sample>" } ... }
//                 "find" is the DONOR's sample (its game_sounds_weapons.txt entry); entries
//                 sharing a "find" are picked at random
//   special       behaviour implemented by tf2cc_specials (chainsaw, gatling, nails,
//                 bomblets_dynamite, bomblets_gib, lightning, sawblade, medkit_pf2, cashwad, ...)
//   special_value numeric parameter for the special (e.g. bomblet count)
//   pack_weight   chance weight for ammo-pack weapon drops (0 = never)
//   droppable     0 = never dropped (e.g. the Fists fallback)
//   sounds_loop   1 = "sounds" replacements loop; stopped when the owner stops firing, switches or dies
//   always_drop   1 = dropped on death even from a default loadout (Civilian umbrella)
//   no_altfire    1 = alt-fire is blocked (donor alt-fire has no OF equivalent)
//   stock_classes / stock_model / extra_roles
//                 stock pickups of these classnames (whose model contains stock_model)
//                 show this weapon's viewmodel; extra_roles = additional animation roles
//   "marxvee" { ... }   overrides used when tf2cc_weapon_profile is "marxvee"
//   tier, ref, note     documentation only (A exact donor, B tuned, C approximation;
//                 ref = Open Fortress / TF2 Classic reference numbers)
