// tf2cc roles. Every role is a logical identity on stock class 10 (TF_CLASS_CIVILIAN).
// Retail class-10 baseline (scripts/playerclasses/civilian.ctx): 200 HP, 250 speed,
// model scout.mdl, hands c_medic_arms.mdl, all max ammo 0.
//
// Keys:
//   name, description           menu text
//   model                       player model (SetCustomModel)
//   use_class_animations        1 = normal player animation on the model's own ACT_MP_*
//                               sequences (required). 0 freezes the player (prop mode).
//   fall_damage                 0 = no fall damage
//   health, speed               target values (applied as player attributes)
//   scoreboard_class            class shown in the player resource instead of 10
//                               (0 = no icon). Never 10: stock scoreboard/team
//                               status read past their icon arrays for dead class 10.
//   random_weight               weight in the Random pool (each stock class = 1)
//   team_limit                  0 unlimited, -1 disabled
//   allow_bots, admin_flags, deny_map_prefixes (comma list, default "mvm_")
//   voice                       persona section in voice.cfg
//   arms_mode                   family  = per-donor-class arm models in arms_family_dir
//                               overlay = role arms bonemerged over stock donor arms
//   loadout_primary/secondary/melee   weapon ids from weapons.cfg
//   ammopack_weapons            ammo packs may also grant weapons
//   can_pickup                  may pick up / drop / swap weapons
"tf2cc_roles"
{
	"mercenary"
	{
		"name"              "Mercenary"
		"description"       "Collect weapons from ammo packs or off the ground. Autohop to move faster."
		"model"             "models/player/tf2cc/mercenary.mdl"   // = customclasses/mercenary/mercenary.mdl + PRIMARY2 include (Cow Mangler)
		"use_class_animations" "1"
		// Open Fortress scripts/playerclasses/mercenary.txt
		"health"            "150"
		"speed"             "320"
		"fall_damage"       "0"     // OF: Mercenary takes no fall damage
		"scoreboard_class"  "0"
		"random_weight"     "1"
		"team_limit"        "0"
		"allow_bots"        "1"
		"voice"             "mercenary"
		// overlay: stock donor arms animate hidden, c_merc_arms + the weapon are
		// bonemerged on top (MarxVee ViewModel_Create). The mercarms/ models are
		// stock-skinned arm copies, so "family" showed no Merc hands.
		"arms_mode"         "overlay"
		"arms_family_dir"   "models/weapons/customclasses/customclassarms/mercarms"
		"arms_model"        "models/weapons/customclasses/customclassarms/c_merc_arms.mdl"
		"loadout_primary"   ""
		"loadout_secondary" "merc_pistol"
		"loadout_melee"     "merc_crowbar"
		"ammopack_weapons"  "1"
		"can_pickup"        "1"
		// tf2cc_taunts: sequence:seconds:voice-concept (sequences verified with tools/mdlinfo.py)
		// OF talker tf.txt (Knuckles Crack / So Close / Groovy / Dead Meat / Bond rules): the taunt
		// follows the held weapon. Scenes from OF scenes/player/mercenary/low/*.vcd (lengths, lines).
		// Model events with OF-only sound scripts (cycle x sequence length; stock ones play by themselves).
		"taunt_events"      "taunt_bond=1.584:snd:player/taunt_bond_pistol.wav"
		"weapon_taunts"     "merc_supershotgun=taunt01:3.37;merc_rocketlauncher=taunt01:3.37;merc_railgun=taunt01:3.37;merc_gatling=taunt01:3.37;merc_lightning=taunt01:3.37;merc_shotgun=taunt02:2.93:_laughevil:1.66;merc_dynamite=taunt02:2.93:_laughevil:1.66;merc_nailgun=taunt02:2.93:_laughevil:1.66;merc_chinalake=taunt02:2.93:_laughevil:1.66;merc_tommygun=taunt02:2.93:_laughevil:1.66;merc_assaultrifle=taunt02:2.93:_laughevil:1.66;merc_crowbar=taunt03:1.83;merc_leadpipe=taunt03:1.83;merc_knife=taunt03:1.83;merc_flamethrower=taunt03:1.83;merc_berserk=taunt04:2.23;merc_gib=taunt04:2.23;merc_quad=taunt04:2.23;merc_chainsaw=taunt04:2.23;merc_chainsaw_knife=taunt04:2.23;merc_pistol=taunt_bond:2.95;merc_akimbo=taunt_bond:2.95;merc_revolver=taunt_bond:2.95;default=taunt01:3.37"
		// seq:seconds[:concept[:voice delay s[:halloween]]].
		// OF: every Mercenary taunt is a laugh scene (talker PlayerTauntsMercenary: LaughLong02,
		// LaughShort01-04) plus the Bond taunt. The model has no Merc laugh body animation, so
		// the stock taunt_laugh (4.87 s) carries the laugh lines. MarxVee extras: taunt01-06.
		"taunts"            "taunt_laugh:4.87:_laughlong:0.15,taunt_laugh:4.87:_laughhappy:0.15,taunt_laugh:4.87:_laughevil:0.15,taunt_bond:3.0"
	}
	"civilian"
	{
		"name"              "Civilian"
		"description"       "Heal and protect nearby teammates. Alt-fire the umbrella to boost a teammate."
		"model"             "models/player/tf2cc/civilian.mdl"   // = civilian_new/civilian.mdl + ITEM1 include (tools/mdl_add_include.py)
		"use_class_animations" "1"
		// TF2 Classified scripts/playerclasses/civilian.txt (installed build)
		"health"            "200"
		"speed"             "280"
		"scoreboard_class"  "0"
		"random_weight"     "1"
		"team_limit"        "0"
		"allow_bots"        "1"
		"voice"             "civilian"
		"arms_mode"         "overlay"
		"arms_model"        "models/weapons/customclasses/customclassarms/c_civi_arms.mdl"
		"loadout_primary"   ""
		// TF2C parity is umbrella only. Legacy MarxVee options: "civ_backupplan" or "civ_cashwad".
		"loadout_secondary" ""
		"loadout_melee"     "civ_umbrella"
		"ammopack_weapons"  "0"
		"can_pickup"        "0"
		// TF2C talker tf.txt: umbrella taunt = taunt01 (6.37 s), Halloween taunt = taunt06
		// (2.53 s); taunt_sandvich is lunchbox-only. The model's "taunt_laugh" is the
		// sandvich animation and "taunt_buy_a_life" a copy of taunt01, so neither is used.
		"taunts"            "taunt01:6.37,taunt06:2.53:::halloween"   // TF2C taunt01.vcd / taunt06.vcd have no speak events
		// TF2C model events on taunt01 (191 f @30): Taunt.Civilian* sound scripts are TF2C-only.
		"taunt_events"      "taunt01=0.77:snd:player/taunt_clothes_swipe.wav|2.15:snd:player/taunt_clothes_rustle.wav|2.21:snd:player/taunt_civilian_bill_select.wav|4.09:snd:player/taunt_clothes_swipe.wav|4.19:snd:player/taunt_civilian_bill_throw.wav|4.19:fx:taunt_spy_cash:head|5.39:snd:player/taunt_clothes_swipe2.wav"
	}
}
